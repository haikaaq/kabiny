name: диагностика

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: проверка
        run: |
          ip=$(curl -s --max-time 10 https://api.ipify.org)
          t=$(curl -s -o /dev/null --connect-timeout 10 -w "%{http_code}" "https://tuttiho.ru/product/akusticheskaya-ofisnaya-kabina-izobox-office-solo-tsveta--chernyyzheltyy/" || true)
          a=$(curl -s -o /dev/null --connect-timeout 10 -w "%{http_code}" "https://acousticmos.ru/zvukoizolyaciya/akusticheskie-kabiny/cube-office-double-glass-1x-odnostoronnee-osteklenie/" || true)
          echo "РЕЗУЛЬТАТ ${ip%.*}.x tuttiho $t acousticmos $a"
