name: Обновление цен конкурентов

on:
  schedule:
    - cron: '7 3 * * *'   # каждый день в 06:07 по Москве
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Перечитать цены на сайтах
        run: node update.mjs
        env:
          RUNNER_NAME_RU: ежедневная проверка
      - name: Сохранить изменения
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json history.json history.csv
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Цены на $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

  deploy:
    needs: update
    if: always() && needs.update.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Собрать сайт
        run: mkdir _site && cp index.html prices.json history.json history.csv _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
