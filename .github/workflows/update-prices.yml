name: Обновление цен конкурентов

on:
  schedule:
    - cron: '7 3 * * *'   # каждый день в 06:07 по Москве
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  # часть сайтов не пускает некоторые машины GitHub: машины берутся по очереди,
  # цены обновляются на первой, где прошла проверка probe.mjs (на последней попытке — в любом случае)
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        try: [1, 2, 3, 4, 5]
    steps:
      - id: done
        uses: actions/download-artifact@v4
        with:
          name: prices-updated
          path: /tmp/done
        continue-on-error: true
      - if: steps.done.outcome != 'success'
        uses: actions/checkout@v4
      - if: steps.done.outcome != 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: probe
        if: steps.done.outcome != 'success'
        name: Пускают ли сайты эту машину
        run: node probe.mjs
      - id: go
        if: steps.done.outcome != 'success' && (steps.probe.outputs.ok == 'true' || matrix.try == 5)
        name: Перечитать цены на сайтах
        run: node update.mjs
        env:
          RUNNER_NAME_RU: ежедневная проверка
      - name: Сохранить изменения
        if: steps.go.outcome == 'success'
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json history.json history.csv
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Цены на $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
          date -u > /tmp/updated.txt
      - if: steps.go.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: prices-updated
          path: /tmp/updated.txt
          retention-days: 1

  deploy:
    needs: update
    if: always() && needs.update.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Собрать сайт
        run: mkdir _site && cp index.html prices.json history.json history.csv _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
